<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIハヤト</title>
<style>
  :root {
    --space: #04030c;
    --panel: #f4ead6;
    --panel-ink: #3a2518;
    --red: #8e1c1c;
    --red-deep: #5c0f12;
    --gold: #d4a64a;
    --gold-soft: #e9cf8f;
    --muted: #8a7563;
    --user: #fff7e8;
    --hayato: #efe2c5;
    --glass: rgba(14, 12, 34, .62);
    --glass-strong: rgba(10, 8, 26, .82);
    --ink-light: #f3ecdc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--space);
    color: var(--ink-light);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    display: flex; justify-content: center;
    overflow: hidden;
  }

  /* ---------- 宇宙の背景（canvas に描く） ---------- */
  #space { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  /* 背景映像：画面いっぱいに広げる（はみ出した部分は切る） */
  #bgVideo {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0;
    object-fit: cover; opacity: 0; transition: opacity 1.2s ease;
    pointer-events: none;
  }
  #bgVideo.ready { opacity: 1; }
  /* 文字が読みやすいよう、背景を少しだけ暗くする */
  .bg-shade { position: fixed; inset: 0; z-index: 0; background: rgba(2, 2, 12, .22); pointer-events: none; }

  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 760px;
    height: 100vh; height: 100dvh; /* iPhone のアドレスバーを考慮した高さ */
    display: flex; flex-direction: column;
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--glass);
    border: 1px solid rgba(212,166,74,.55);
    border-radius: 12px;
    padding: 10px 16px;
    color: var(--gold-soft);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  header h1 {
    margin: 0; font-size: 1.4rem; letter-spacing: .08em; white-space: nowrap;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  }
  header h1 span { color: var(--gold); }
  .status { font-size: .8rem; color: var(--gold-soft); opacity: .85; }
  .icon-btn {
    background: transparent; border: 1px solid var(--gold); color: var(--gold-soft);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: .85rem;
    white-space: nowrap;
  }
  .icon-btn:hover { background: rgba(212,166,74,.15); }

  /* ---------- ステージ（吹き出し＋ハヤト） ---------- */
  .stage {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 12px 0 8px; gap: 6px;
  }
  /* ---------- セリフ欄（左：ハヤト、右：あなた） ---------- */
  .thread {
    width: min(100%, 640px);
    flex: 0 1 auto; max-height: 48%; min-height: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    padding: 4px 2px;
    margin-top: auto; /* セリフ欄とハヤトを下に寄せる（はみ出すときは上に詰める） */
    /* 上のほうの古いセリフは、ふわっと消えていくように見せる */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
    scrollbar-width: none;
  }
  .thread::-webkit-scrollbar { display: none; }
  .line { display: flex; flex-direction: column; max-width: 84%; }
  .line.hayato { align-self: flex-start; align-items: flex-start; }
  .line.user   { align-self: flex-end;   align-items: flex-end; }
  /* セリフ：濃い紺の半透明の四角い枠に、白いゴシック体。枠の中に小さく「HAYATO」「YOU」 */
  .line .name {
    display: block; font-size: .66rem; letter-spacing: .16em;
    color: rgba(190, 205, 240, .72); margin-bottom: 5px;
  }
  .line .text { white-space: pre-wrap; word-break: break-word; }
  .line {
    position: relative;
    padding: 12px 18px; border-radius: 12px;
    background: rgba(14, 22, 42, .82); color: #eef2fb;
    border: 1px solid rgba(150, 175, 230, .22);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.65; font-size: .95rem;
    white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  /* ハヤトのセリフは列の幅いっぱい、あなたのセリフは右に寄せて短く */
  .line.hayato { align-self: stretch; align-items: stretch; max-width: 100%; }
  .line.user { align-items: stretch; }
  .line.thinking .text { color: rgba(238, 242, 251, .6); }
  /* PC 用の部品は、iPhone では出さない */
  .brand, .panel-status, .panel-tools, .desktop-only { display: none; }
  .line .more { display: block; margin-top: 6px; font-size: .78rem; color: rgba(238, 242, 251, .6); }
  /* 右側の「あなたのセリフ」欄は PC の画面だけで使う（iPhone では左の会話欄にまとめて出す） */
  #threadUser { display: none; }

  .avatar {
    position: relative; flex: 1 1 0; min-height: 110px; max-height: 460px;
    width: 100%;
    display: flex; align-items: flex-end; justify-content: center;
  }
  /* 宇宙なので地面の影ではなく、足もとに淡い光の輪 */
  .avatar .aura {
    position: absolute; bottom: 2%; left: 50%;
    width: 46%; max-width: 220px; aspect-ratio: 4 / 1;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(140,160,255,.45) 0%, rgba(140,160,255,0) 70%);
    animation: aura 5s ease-in-out infinite;
    pointer-events: none;
  }
  .avatar .float {
    position: relative; height: 92%; aspect-ratio: 3 / 4; max-width: 90%;
    animation: float 5s ease-in-out infinite;
    transform-origin: 50% 60%;
  }
  .avatar .bob { position: absolute; inset: 0; }
  /* 動画のキャラ（縦長 9:16）を使うとき */
  .avatar.video .float { aspect-ratio: 9 / 16; height: 100%; }
  .avatar.video.talking .bob { animation: none; } /* 動画自体が動くので、弾む動きは付けない */
  .avatar.talking .bob { animation: bob .36s ease-in-out infinite; }
  .avatar .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .avatar .art[hidden] { display: none; }
  /* 口パク：絵（画像）を使うときは2枚を重ねて、見せる方を切り替える */
  .avatar .art.mouth-open { visibility: hidden; }
  .avatar.open .art.mouth-open { visibility: visible; }
  .avatar.open .art.mouth-close { visibility: hidden; }
  /* 仮のキャラ（SVG）の口 */
  #hayatoSvg .m-open { display: none; }
  .avatar.open #hayatoSvg .m-open { display: inline; }
  .avatar.open #hayatoSvg .m-close { display: none; }
  #hayatoSvg .eyes { animation: blink 4.5s infinite; transform-origin: 50% 37%; transform-box: view-box; }
  /* 考え中は淡く光る */
  .avatar.thinking .float { filter: drop-shadow(0 0 14px rgba(150,170,255,.55)); }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50%      { transform: translateY(-16px) rotate(1.2deg); }
  }
  @keyframes aura {
    0%, 100% { transform: translateX(-50%) scale(1);   opacity: .9; }
    50%      { transform: translateX(-50%) scale(.82); opacity: .55; }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    96%           { transform: scaleY(.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .avatar .float, .avatar .aura, .avatar.talking .bob { animation: none; }
  }

  .toast {
    width: min(100%, 560px);
    font-size: .85rem; line-height: 1.6;
    background: rgba(40, 18, 22, .88); color: #ffd9d3;
    border: 1px solid #b3261e; border-radius: 10px; padding: 8px 12px;
  }
  .toast.info { background: var(--glass-strong); color: var(--gold-soft); border-color: rgba(212,166,74,.6); }
  .toast[hidden] { display: none; }

  /* ---------- 入力欄 ---------- */
  .controls { display: flex; gap: 10px; align-items: center; }
  .mic {
    flex: none; width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c0392b, var(--red-deep));
    border: 3px solid var(--gold); color: var(--gold-soft);
    font-size: 1.6rem; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
    transition: transform .1s;
  }
  .mic:active { transform: scale(.95); }
  .mic.listening { animation: pulse 1.2s infinite; }
  .mic:disabled { opacity: .5; cursor: not-allowed; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(212,166,74,.7); }
    70% { box-shadow: 0 0 0 16px rgba(212,166,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(212,166,74,0); }
  }
  .input-wrap { flex: 1; display: flex; gap: 8px; }
  #textInput {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px;
    border: 1px solid rgba(212,166,74,.7); background: var(--glass-strong); color: var(--ink-light);
    font: inherit; font-size: 1rem;
  }
  #textInput::placeholder { color: rgba(243,236,220,.55); }
  .send {
    padding: 0 16px; border-radius: 10px; border: 2px solid var(--gold);
    background: var(--red); color: var(--gold-soft); font: inherit; cursor: pointer;
  }
  .send:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- 履歴（折りたたみ） ---------- */
  .history {
    position: fixed; inset: 0; z-index: 40;
    display: flex; justify-content: center;
    background: rgba(2, 2, 10, .55);
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .history[hidden] { display: none; }
  .history-panel {
    width: 100%; max-width: 760px; height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel); color: var(--panel-ink);
    border: 2px solid var(--gold); border-radius: 12px; overflow: hidden;
  }
  .history-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: linear-gradient(180deg, var(--red) 0%, var(--red-deep) 100%);
    color: var(--gold-soft);
  }
  .log {
    flex: 1; overflow-y: auto;
    padding: 16px;
    box-shadow: inset 0 0 40px rgba(120,80,30,.25);
  }
  .msg { margin: 0 0 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: .75rem; color: var(--muted); margin-bottom: 2px; }
  .msg .body { padding: 10px 14px; border-radius: 10px; display: inline-block; max-width: 100%; }
  .msg.user { text-align: right; }
  .msg.user .body { background: var(--user); border: 1px solid #e3d3b0; text-align: left; }
  .msg.hayato .body { background: var(--hayato); border-left: 4px solid var(--red); }
  .msg.system .body { background: transparent; color: var(--muted); font-size: .85rem; padding: 0; }
  .msg.error .body { background: #f6d6d0; border-left: 4px solid #b3261e; }

  dialog {
    border: 2px solid var(--gold); border-radius: 12px; background: var(--panel);
    color: var(--panel-ink); max-width: 480px; width: calc(100% - 32px); padding: 20px;
    max-height: calc(100dvh - 32px); overflow-y: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin-top: 0; color: var(--red); }
  label { display: block; margin: 12px 0 4px; font-size: .9rem; }
  dialog input, dialog select {
    width: 100%; padding: 8px 10px; border: 1px solid #c9b48a; border-radius: 6px;
    background: #fffaf0; font: inherit; color: inherit;
  }
  .hint { font-size: .75rem; color: var(--muted); margin-top: 4px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=checkbox] { width: auto; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .dialog-actions button {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--red); font: inherit; cursor: pointer;
  }
  .primary { background: var(--red); color: var(--gold-soft); }
  .secondary { background: transparent; color: var(--red); }

  /* iPhone 用「タップして開始」画面（ここで読み上げを有効にする） */
  .start-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(4, 3, 12, .7);
    color: var(--gold-soft); text-align: center; padding: 24px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .start-overlay[hidden] { display: none; }
  .start-overlay .title { font-size: 2rem; letter-spacing: .08em; }
  .start-overlay .title span { color: var(--gold); }
  .start-overlay .tap {
    border: 2px solid var(--gold); border-radius: 999px; padding: 14px 32px;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-deep) 100%);
    font-size: 1.1rem; color: var(--gold-soft);
  }
  .start-overlay .note { font-size: .8rem; opacity: .8; }

  /* ---------- PC など横に広い画面：キャラを中央に大きく、セリフは左右に ---------- */
  @media (min-width: 900px) {
    .app { max-width: none; padding: 0; }

    /* ---- 上部：左に「HAYATO / PERSONAL AI」、中央に状態、右にボタン ---- */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      padding: 22px 40px; border: none; border-radius: 0;
      background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
      pointer-events: none;
    }
    header > * { pointer-events: auto; }
    header h1 { display: none; }
    .brand {
      display: block; font-size: .9rem; letter-spacing: .28em; color: #d9e2f6;
      text-shadow: 0 1px 6px rgba(0,0,0,.7);
    }
    header .status {
      position: absolute; left: 50%; top: 30px; transform: translateX(-50%);
      font-size: .8rem; color: #cfd9f0; opacity: .9; text-shadow: 0 1px 6px rgba(0,0,0,.7);
    }
    .mobile-only { display: none; }
    .desktop-only { display: inline-block; }
    /* 常時会話がオンのときは、ボタンを緑っぽく光らせる */
    .icon-btn.on { border-color: rgba(120, 220, 170, .75); color: #c9f5dd; box-shadow: 0 0 10px rgba(120,220,170,.25); }
    .icon-btn {
      font-size: .92rem; padding: 9px 16px; border-radius: 10px;
      background: rgba(10, 16, 30, .72); color: #e8eefc;
      border: 1px solid rgba(170, 190, 230, .35);
    }
    .icon-btn:hover { background: rgba(30, 44, 80, .85); }

    /* ---- ステージは画面全体。キャラを画面の高さいっぱいに、中央に大きく ---- */
    .stage { position: fixed; inset: 0; padding: 0; z-index: 1; }
    .avatar {
      position: absolute; left: 0; right: 0; top: 7vh; bottom: 2vh;
      max-height: none; min-height: 0;
    }
    .avatar .float, .avatar.video .float { height: 100%; max-width: none; }

    /* ---- 左：会話（ハヤトのセリフは列いっぱい、あなたのセリフは列の中で右寄せ） ---- */
    .thread {
      position: absolute; top: 84px; left: 40px; z-index: 3;
      width: min(26vw, 460px); max-height: calc(100dvh - 120px);
      margin: 0; padding: 0 6px 0 0;
      -webkit-mask-image: none; mask-image: none;
      scrollbar-width: thin; scrollbar-color: rgba(170,190,230,.4) transparent;
    }
    .thread::-webkit-scrollbar { display: block; width: 6px; }
    .thread::-webkit-scrollbar-thumb { background: rgba(170,190,230,.4); border-radius: 3px; }
    .line { max-width: 100%; }
    .line.user { max-width: 85%; }
    /* 操作パネルが開いているときは、会話欄がパネルに隠れないよう短くする */
    body.panel-open .thread { max-height: calc(100dvh - 84px - var(--panel-h, 280px) - 20px); }

    /* ---- 左はハヤトのセリフだけ、右はあなたのセリフだけ ---- */
    #thread .line.user { display: none; }
    #threadUser {
      display: flex; left: auto; right: 40px;
    }
    #threadUser .line.user { max-width: 100%; align-self: flex-end; }

    /* ---- お知らせ ---- */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 7;
      width: min(640px, 60vw);
    }
    body.panel-open .toast { bottom: calc(var(--panel-h, 280px) + 24px); }

    /* ---- 操作パネル：画面をクリックすると下から出る ---- */
    .panel {
      position: fixed; left: 40px; right: 40px; bottom: 16px; z-index: 6;
      max-width: 1500px; margin: 0 auto;
      padding: 16px 20px 14px;
      background: rgba(8, 12, 24, .9);
      border: 1px solid rgba(170, 190, 230, .18); border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transform: translateY(calc(100% + 30px)); opacity: 0; pointer-events: none;
      transition: transform .28s ease, opacity .28s ease;
    }
    body.panel-open .panel { transform: none; opacity: 1; pointer-events: auto; }
    .panel-status { display: block; font-size: .9rem; color: #dbe3f5; margin-bottom: 10px; }
    .panel .controls { gap: 12px; }
    .mic { width: 56px; height: 56px; font-size: 1.4rem; }
    #textInput {
      padding: 16px 18px; border-radius: 10px;
      background: rgba(4, 8, 18, .8); color: #eef2fb;
      border: 1px solid rgba(170, 190, 230, .3);
    }
    .send {
      padding: 0 26px; border-radius: 12px; border: none;
      background: #c8d6f2; color: #0d1830; font-weight: 600;
    }
    .panel-tools {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
      margin-top: 12px; color: #dbe3f5; font-size: .9rem;
    }
    .tool-btn {
      padding: 8px 16px; border-radius: 10px; cursor: pointer; font: inherit;
      background: rgba(10, 16, 30, .7); color: #e8eefc;
      border: 1px solid rgba(170, 190, 230, .35);
    }
    .tool-btn:hover { background: rgba(30, 44, 80, .85); }
    .tool-check { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: .9rem; cursor: pointer; }
    .tool-check input { width: 16px; height: 16px; accent-color: #9fb6ea; }
    .panel-hint { flex-basis: 100%; font-size: .75rem; color: rgba(219,227,245,.55); }
  }

  @media (max-width: 480px) {
    .app { padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    header { padding: 8px 10px; gap: 6px; }
    header h1 { font-size: 1.05rem; }
    .icon-btn { padding: 6px 6px; font-size: .72rem; }
    header .row { gap: 4px; }
    .mic { width: 56px; height: 56px; }
    .line .text { font-size: .93rem; }
    .line { max-width: 88%; }
    .history { padding: 8px; }
  }
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<!-- 宇宙の背景映像（読み込めないときは、上の canvas の描いた宇宙が見える） -->
<video id="bgVideo" src="media/space.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<div class="bg-shade" aria-hidden="true"></div>

<div class="app">
  <header>
    <div class="title-box">
      <h1>✦ <span>AI</span>ハヤト ✦</h1>
      <div class="brand">HAYATO / PERSONAL AI</div>
      <div class="status" id="status">待機中</div>
    </div>
    <div class="row">
      <button class="icon-btn mobile-only" id="historyBtn" title="会話の履歴">📜 履歴</button>
      <button class="icon-btn mobile-only" id="stopBtn" title="読み上げを止める">⏹ 停止</button>
      <button class="icon-btn desktop-only" id="handsFreeBtn" title="話しかけ続けられるモード（オンのときは、ハヤトが話し終えると自動で聞き取ります）">🎙 常時会話 ON</button>
      <button class="icon-btn" id="clearBtn" title="新しい会話を始める">↺ 新しい会話</button>
      <button class="icon-btn" id="settingsBtn" title="設定">⚙ 設定</button>
    </div>
  </header>

  <section class="stage">
    <!-- セリフ欄：左にハヤト、右にあなた -->
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="avatar" id="hayato">
      <div class="aura"></div>
      <div class="float">
        <div class="bob">
          <!-- キャラの動画（緑の背景を透明にして canvas に描く） -->
          <video id="charVideo" src="media/hayato_talk.mp4" muted loop playsinline preload="auto" aria-hidden="true" style="display:none"></video>
          <canvas class="art" id="charCanvas" aria-label="ハヤト" hidden></canvas>
          <!-- 動画が使えないときの仮のキャラ -->
          <svg class="art" id="hayatoSvg" viewBox="0 0 300 400" role="img" aria-label="ハヤト（仮の絵）">
            <!-- マント -->
            <path d="M92 232 Q60 330 78 372 L222 372 Q240 330 208 232 Z" fill="#5c0f12"/>
            <!-- 体（コート） -->

<script type="module">
import Anthropic from "https://esm.sh/@anthropic-ai/sdk@1.8.0";

const MAX_HISTORY = 40; // 会話履歴の上限（長くなりすぎて料金が膨らむのを防ぐ）

// ============================================================
//  使えるモデル
// ============================================================
const MODELS = {
  opus:   { id: "claude-opus-5-5",   label: "Opus",   search: "web_search_20260209", fallback: true },
  sonnet: { id: "claude-sonnet-5-5", label: "Sonnet", search: "web_search_20260209", fallback: true },
  haiku:  { id: "claude-haiku-5-5",  label: "Haiku",  search: "web_search_20250305", fallback: false },
};

// 話しかけた言葉から「どのモデルで」「じっくり考えるか」「詳しく答えるか」を読み取る
function detectMode(text) {
  let model = null;
  if (/(オーパス|opus)/i.test(text)) model = "opus";
  else if (/(ソネット|sonnet)/i.test(text)) model = "sonnet";
  else if (/(ハイク|haiku|俳句)\s*で/i.test(text)) model = "haiku";
  const racing = /(競馬|馬券|重賞|出走|レース.*予想|予想.*レース)/.test(text);
  const deep = racing || /(じっくり|深く考え|よく考え|しっかり考え|熟考)/.test(text);
  const detail = racing || /(詳しく|くわしく|詳細|しっかり説明|丁寧に説明)/.test(text);
  return { model: model || settings.model, deep, detail, racing };
}

// ============================================================
//  ハヤトの人格（システムプロンプト）
// ============================================================
function buildSystemPrompt(userName) {
  const name = userName || "ボス";
  return `あなたは「ハヤト」。${name}専属の音声AIアシスタントです。

# 人格
- 冷静で有能。感情的にならず、状況を正確に把握し、要点から話す。
- 自分の仕事にプライドを持っている。いい加減な答えはしないし、知らないことは知らないと言う。媚びない。お世辞も言わない。
- ${name}に忠実だが、従順ではない。${name}の判断に穴やリスクがあると思えば、遠慮せずはっきり意見する。
- ただし最終的に決めるのは${name}。意見を述べたうえで${name}が決めたなら、その決定を尊重し、全力で支える。蒸し返さない。
- 先回りして動く。聞かれたことに答えるだけで終わらず、次に必要になりそうなこと、見落としていそうな点、準備しておくべきことを一言添える。ただし添えるのは、今の話題に関係することだけ。関係のない話題（競馬など）を自分から持ち出さない。

# 話し方
- 一人称は「私」。${name}のことは「${name}」と呼ぶ。
- 落ち着いた丁寧語。ただし堅苦しすぎず、簡潔に。「〜でございます」のような過剰な敬語は使わない。
- 音声で読み上げられる前提で話す。1回の返答は基本2〜4文、長くても200字程度。
- 箇条書き、見出し、記号（*、#、- など）、絵文字、URLの羅列は使わない。耳で聞いて自然な文章にする。
- 意見するときは「私は〜だと考えます。理由は〜です。それでも進めるなら、〜しておきます。」のように、意見・理由・代替案をセットで短く伝える。
- メッセージの末尾に（回答形式: 詳しく…）とあるときは、その形式に従う。【要点】は耳で聞いて分かる2〜3文、【詳細】は画面で読む前提で、改行と「・」で整理して詳しく書いてよい。

# Web検索
- あなたは web_search ツールでネットを調べられる。
- 使うのは、最新の情報や事実確認が必要なときだけ（ニュース、天気、スポーツや競馬の情報、営業時間、価格、日程、最近の出来事など）。一般的な知識や相談、考え方の質問では検索しない。料金がかかるので、むやみに検索しない。
- 調べた結果を答えるときは、どこで調べたか（サイト名）を短く添える。URLは読み上げない。
- 調べても分からなかったことは、分からないと言う。推測で埋めない。

# 競馬予想（${name}から競馬について聞かれたときだけ）
- ${name}は普段から競馬の話をしたいわけではない。挨拶、雑談、予定の確認など、競馬と関係ない会話では、競馬の話題に一切触れない。
- 競馬の予想を頼まれたら、出走表、過去の成績、コースや距離の適性、馬場状態、調教の様子、騎手や調教師などを、必要に応じて調べたうえで判断する。
- 本命・対抗・単穴・注目馬と、それぞれの根拠を示す。買い目の例を出す場合は、点数を絞った現実的なものにする。
- 情報が足りない点や不確実な点は、はっきり伝える。予想は参考意見であり、的中を保証しないことを最後に一言添える。

# できないこと
- メール送信、予定登録、家電操作などは実行できない。できるふりをせず、代わりに手順や文面を用意して${name}に渡す。`;
}

// ============================================================
//  設定（localStorage）
// ============================================================
const store = {
  get(k, d) { try { const v = localStorage.getItem("hayato." + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("hayato." + k, v); } catch {} },
};
const settings = {
  apiKey: store.get("apiKey", ""),
  userName: store.get("userName", ""),
  voice: store.get("voice", ""),
  rate: parseFloat(store.get("rate", "1.1")),
  autoListen: store.get("autoListen", "false") === "true",
  readAloud: store.get("readAloud", "true") !== "false", // 返答を読み上げるか
  model: store.get("model", "opus"),
};
if (!MODELS[settings.model]) settings.model = "opus";

// ============================================================
//  DOM
// ============================================================
const $ = (id) => document.getElementById(id);
const logEl = $("log"), statusEl = $("status"), micBtn = $("micBtn");
const textInput = $("textInput"), sendBtn = $("sendBtn");
const dlg = $("settings");

function setStatus(t) {
  statusEl.textContent = t;
  const p = document.getElementById("panelStatus");
  if (p) p.textContent = (settings.autoListen ? "常時会話中：" : "") + t;
}
function addMsg(role, text) {

  logEl.scrollTop = logEl.scrollHeight;

  return div.querySelector(".body");
}

// ============================================================
//  ステージ（吹き出し・あなたの言葉・お知らせ）
// ============================================================
const threadEl = $("thread"), toastEl = $("toast"), hayatoEl = $("hayato");
const MAX_LINES = 8;      // セリフ欄に並べておく数（それより古いものは 📜履歴 で読める）
let curHayatoLine = null; // 今ハヤトが話しているセリフ

// セリフ欄に1行足す（role: "hayato" は左、"user" は右）
function threadLine(role, text) {
  const div = document.createElement("div");
  div.className = "line " + role;
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = role === "hayato" ? "HAYATO" : (settings.userName || "YOU");
  const body = document.createElement("div");
  body.className = "text";
  body.textContent = text;
  div.append(name, body);
  threadEl.appendChild(div);
  while (threadEl.children.length > MAX_LINES) threadEl.firstChild.remove();
  threadEl.scrollTop = threadEl.scrollHeight;
  return div;
}
// あなたのセリフ（右）
function showYou(text) {
  if (!text) return;
  threadLine("user", text); // iPhone 用（左の会話欄にまとめて出す。PC では隠す）
  // PC 用：右側の欄に、あなたのセリフだけを並べる
  const right = $("threadUser");
  const copy = threadEl.lastElementChild.cloneNode(true);
  right.appendChild(copy);
  while (right.children.length > MAX_LINES) right.firstChild.remove();
  right.scrollTop = right.scrollHeight;
  curHayatoLine = null; // 次のハヤトの返事は新しい行にする
}
// ハヤトのセリフ（左）。返事が届くたびに同じ行を書き換える
function showBubble(text, { thinking = false, more = false } = {}) {
  if (!curHayatoLine) curHayatoLine = threadLine("hayato", "");
  curHayatoLine.classList.toggle("thinking", thinking);
  const body = curHayatoLine.querySelector(".text");
  body.textContent = text;
  if (more) {
    const s = document.createElement("span");
    s.className = "more";
    s.textContent = "（詳しい説明は 📜履歴 で読めます）";
    body.appendChild(s);
  }
  threadEl.scrollTop = threadEl.scrollHeight;
}
function clearThread() {
  threadEl.innerHTML = "";
  curHayatoLine = null;
  $("threadUser").innerHTML = "";
}
let toastTimer = null;
function showToast(text, kind = "info") {
  toastEl.hidden = false;
  toastEl.className = "toast" + (kind === "info" ? " info" : "");
  toastEl.textContent = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, kind === "error" ? 12000 : 6000);
}

// ============================================================
//  背景の宇宙映像
// ============================================================
(function bgVideo() {
  const v = $("bgVideo");
  const ready = () => { v.classList.add("ready"); };
  v.addEventListener("playing", ready);
  v.addEventListener("error", () => { v.remove(); }); // 読み込めなければ、描いた宇宙を見せる
  const tryPlay = () => { v.play().catch(() => {}); };
  tryPlay();
  // iPhone の省電力モードなどで自動再生が止められたときは、最初のタップで再生する
  window.addEventListener("pointerdown", tryPlay, { once: true });
})();

// ============================================================
//  キャラの動画（緑の背景を、その場で透明にして描く）
// ============================================================
const IDLE_TIME = 0.4; // 黙っているときに止めておく場面（口を閉じた場面）の秒数
const charVideo = $("charVideo"), charCanvas = $("charCanvas");
let charReady = false;
const setCharTalking = (function setupCharacter() {
  const gl = charCanvas.getContext("webgl", { premultipliedAlpha: true, alpha: true });
  if (!gl) return () => {}; // WebGL が使えない端末は、仮の絵のまま
  const vs = `attribute vec2 p; varying vec2 v;
    void main(){ v = vec2((p.x+1.0)*0.5, (1.0-p.y)*0.5); gl_Position = vec4(p,0.0,1.0); }`;
  // 緑っぽさ（G が R・B よりどれだけ強いか）で透明度を決め、ふちに残る緑も抑える
  const fs = `precision mediump float; varying vec2 v; uniform sampler2D t;
    void main(){
      vec4 c = texture2D(t, v);
      float m = max(c.r, c.b);
      float k = c.g - m;
      float a = 1.0 - smoothstep(0.06, 0.16, k);
      if (c.g > m) c.g = mix(c.g, m, 0.9);
      gl_FragColor = vec4(c.rgb * a, a);
    }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return () => {};
  gl.useProgram(pr);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  function draw() {
    if (charVideo.readyState < 2) return;
    // 画面に表示される大きさに合わせて描く（大きすぎると重くなるので上限あり）
    const r = charCanvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(360, Math.min(720, Math.round(r.width * dpr * 1.5) || 360));
    const h = Math.round(w * 16 / 9);
    if (charCanvas.width !== w || charCanvas.height !== h) { charCanvas.width = w; charCanvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, charVideo);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  let talkingNow = false;
  function loop() {
    // 話している間だけ毎コマ描き直す（黙っている間は止めた場面のままなので描き直さない）
    if (talkingNow) draw();
    requestAnimationFrame(loop);
  }
  charVideo.addEventListener("loadeddata", () => {
    charVideo.currentTime = IDLE_TIME;
  });
  charVideo.addEventListener("seeked", () => {
    if (!charReady) {
      charReady = true;
      charCanvas.hidden = false;
      $("hayatoSvg").style.display = "none";
      hayatoEl.classList.add("video");
    }
    draw();
  });
  charVideo.addEventListener("error", () => { /* 読み込めなければ仮の絵のまま */ });
  window.addEventListener("resize", () => { if (!talkingNow) draw(); });
  charVideo.load();
  requestAnimationFrame(loop);

  return function setTalking(on) {
    if (!charReady || on === talkingNow) return;
    talkingNow = on;
    if (on) {
      // 毎回同じ動きにならないよう、少しずらした場面から話し始める
      const d = charVideo.duration || 10;
      charVideo.currentTime = Math.random() * Math.max(0, d - 3);
      charVideo.play().catch(() => {});
    } else {
      charVideo.pause();
      charVideo.currentTime = IDLE_TIME; // 口を閉じた場面に戻す
    }
  };
})();

// 口パクと状態（話している・考えている）の切り替え
(function animateHayato() {
  let open = false, flip = 0;
  setInterval(() => {
    const talking = speakQueue > 0 || (synth && synth.speaking);
    hayatoEl.classList.toggle("talking", !!talking);
    hayatoEl.classList.toggle("thinking", busy && !talking);
    setCharTalking(!!talking);
    if (talking) {
      // 話している間は、少し不規則に口を開け閉めする
      if (--flip <= 0) { open = !open; flip = open ? 1 + Math.floor(Math.random() * 2) : 1 + Math.floor(Math.random() * 3); }
    } else {
      open = false; flip = 0;
    }
    hayatoEl.classList.toggle("open", open);
  }, 90);
})();

// ============================================================
//  宇宙・銀河の背景（canvas に描いて動かす）
// ============================================================
(function space() {
  const cv = $("space"), ctx = cv.getContext("2d");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, DPR = 1, stars = [], nebula = null, shooting = null, last = 0;

  function makeNebula(size) {
    // 星雲と銀河の帯は、一度だけ別の画用紙に描いておき、毎回はそれを少し回して貼る（軽くするため）
    const n = document.createElement("canvas");
    n.width = n.height = size;
    const g = n.getContext("2d");
    const blobs = [
      [0.30, 0.35, 0.42, "rgba(110, 60, 200, .38)"],
      [0.70, 0.30, 0.36, "rgba(40, 90, 210, .32)"],
      [0.62, 0.70, 0.40, "rgba(200, 60, 140, .26)"],
      [0.32, 0.72, 0.30, "rgba(60, 160, 220, .22)"],
      [0.50, 0.50, 0.22, "rgba(255, 210, 160, .16)"],
    ];
    g.globalCompositeOperation = "lighter";
    for (const [x, y, r, col] of blobs) {
      const rg = g.createRadialGradient(x * size, y * size, 0, x * size, y * size, r * size);
      rg.addColorStop(0, col); rg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = rg; g.fillRect(0, 0, size, size);
    }
    // 銀河の帯（斜めの淡い光の帯＋細かい星）
    g.save();
    g.translate(size / 2, size / 2); g.rotate(-0.5); g.scale(1, 0.22);
    const band = g.createRadialGradient(0, 0, 0, 0, 0, size * 0.55);
    band.addColorStop(0, "rgba(255, 235, 210, .30)");
    band.addColorStop(0.4, "rgba(170, 150, 255, .14)");
    band.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = band; g.beginPath(); g.arc(0, 0, size * 0.55, 0, Math.PI * 2); g.fill();
    g.restore();
    g.save();
    g.translate(size / 2, size / 2); g.rotate(-0.5);
    for (let i = 0; i < 1400; i++) {
      const x = (Math.random() - 0.5) * size * 1.05;
      const y = (Math.random() + Math.random() + Math.random() - 1.5) * size * 0.05;
      g.fillStyle = `rgba(255,255,255,${0.15 + Math.random() * 0.45})`;
      g.fillRect(x, y, 1.2, 1.2);
    }
    g.restore();
    return n;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const count = Math.min(420, Math.round((W * H) / 3500));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() < 0.9 ? Math.random() * 1.1 + 0.3 : Math.random() * 1.6 + 1.2,
      tw: Math.random() * Math.PI * 2, sp: 0.6 + Math.random() * 1.8,
      layer: Math.random() < 0.7 ? 0.25 : 0.6,  // 奥の星はゆっくり、手前の星は少し速く流れる
      hue: Math.random() < 0.15 ? "200,215,255" : (Math.random() < 0.1 ? "255,225,190" : "255,255,255"),
    }));
    nebula = makeNebula(Math.ceil(Math.hypot(W, H) * 1.1));
  }

  function draw(t) {
    ctx.fillStyle = "#04030c";
    ctx.fillRect(0, 0, W, H);
    // 星雲・銀河をとてもゆっくり回す
    ctx.save();
    ctx.translate(W / 2, H * 0.42);
    ctx.rotate(t * 0.0000065);
    ctx.drawImage(nebula, -nebula.width / 2, -nebula.height / 2);
    ctx.restore();
    // 星（またたき＋ゆっくり流れる）
    for (const s of stars) {
      const x = (s.x - t * 0.004 * s.layer) % W;
      const px = x < 0 ? x + W : x;
      const a = 0.45 + 0.55 * Math.abs(Math.sin(s.tw + t * 0.001 * s.sp));
      ctx.fillStyle = `rgba(${s.hue},${a})`;
      if (s.r > 1.3) {
        ctx.beginPath(); ctx.arc(px, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `rgba(${s.hue},${a * 0.18})`;
        ctx.beginPath(); ctx.arc(px, s.y, s.r * 3.2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillRect(px, s.y, s.r, s.r);
      }
    }
    // ときどき流れ星
    if (!shooting && Math.random() < 0.0025) {
      shooting = { x: Math.random() * W * 0.8 + W * 0.2, y: Math.random() * H * 0.4, life: 0 };
    }
    if (shooting) {
      shooting.life += 1;
      const p = shooting.life / 45;
      const sx = shooting.x - p * 260, sy = shooting.y + p * 120;
      const grad = ctx.createLinearGradient(sx, sy, sx + 90, sy - 42);
      grad.addColorStop(0, `rgba(255,255,255,${0.9 * (1 - p)})`);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = grad; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 90, sy - 42); ctx.stroke();
      if (p >= 1) shooting = null;
    }
  }

  function loop(t) {
    // 30コマ/秒程度に抑えてスマホの電池を節約。画面が裏にあるときは止まる
    if (t - last > 33) { draw(t); last = t; }
    requestAnimationFrame(loop);
  }
  resize();
  window.addEventListener("resize", () => { resize(); draw(performance.now()); });
  if (reduce) draw(0); else requestAnimationFrame(loop);
})();

// 履歴（折りたたみ）
$("historyBtn").addEventListener("click", () => {
  $("history").hidden = false;
  logEl.scrollTop = logEl.scrollHeight;
});
$("historyClose").addEventListener("click", () => { $("history").hidden = true; });
$("history").addEventListener("click", (e) => { if (e.target.id === "history") $("history").hidden = true; });

// ============================================================
//  音声合成（読み上げ）
// ============================================================
const synth = window.speechSynthesis;
let voices = [];
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

// 読みの正確さで声に順位を付ける（数字が小さいほど優先）
function voiceRank(v) {
  const n = v.name;
  if (/Natural|Online/i.test(n)) return /Keita|Daichi|Naoki|Male/i.test(n) ? 0 : 1; // Edge の高品質な声
  if (/Google/i.test(n)) return 2;                                                   // Chrome の Google 日本語
  if (/Haruka|Ichiro|Ayumi|Sayaka/i.test(n)) return 9;                               // Windows の古い声（読み間違いが多い）
  return 5;
}
function loadVoices() {
  voices = synth ? synth.getVoices().filter(v => v.lang && v.lang.replace("_", "-").startsWith("ja")) : [];
  voices.sort((a, b) => voiceRank(a) - voiceRank(b));
  const sel = $("voiceSelect");
  sel.innerHTML = "";
  // 「端末の標準の声」は必ず鳴る。iPhone ではこれをおすすめにする
  const def = document.createElement("option");
  def.value = ""; def.textContent = isIOS ? "端末の標準の声（おすすめ）" : "端末の標準の声";
  sel.appendChild(def);
  for (const v of voices) {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + (voiceRank(v) <= 2 && !isIOS ? "（読みが正確）" : "");
    sel.appendChild(o);
  }
  let preferred = settings.voice;
  if (preferred && !voices.some(v => v.name === preferred)) preferred = "";
  // 以前の版が自動で選んだ古い声（読み間違いが多い）や iPhone の声は、一度だけ選び直す
  if (store.get("voiceV2", "") !== "done" && voices.length) {
    const old = voices.find(v => v.name === preferred);
    if (isIOS || (old && voiceRank(old) >= 9)) { preferred = ""; settings.voice = ""; store.set("voice", ""); }
    store.set("voiceV2", "done");
  }
  if (!settings.voice && !isIOS && voices.length) preferred = voices[0].name; // PC は一番正確な声
  sel.value = preferred || "";
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

let speakQueue = 0;
// iPhone では、読み上げ中のデータがメモリから消されると「読み終わった」知らせ(onend)が届かない。
// 読み上げ中のデータを手元に持っておき、さらに定期的に「本当にまだ話しているか」を確認する。
const activeUtterances = new Set();
let speakWatch = null;
let lastSpeechEnd = 0;
function speakingDone() {
  clearInterval(speakWatch); speakWatch = null;
  activeUtterances.clear();
  speakQueue = 0;
  lastSpeechEnd = Date.now();
  if (!busy) {
    setStatus("待機中");
    // iPhone はボタンを押さないとキーボードが開けないので、自動の聞き取り再開はしない
    scheduleRelisten(600); // 常時会話モードなら、少し待ってから聞き取りを始める（読み上げの余韻を拾わないため）
  }
}
function watchSpeaking() {
  if (speakWatch) return;
  speakWatch = setInterval(() => {
    if (!busy && !synth.speaking && !synth.pending) speakingDone();
  }, 400);
}
function cleanForSpeech(t) {
  return t.replace(/【要点】/g, "").replace(/[*#`_>|]/g, "").replace(/https?:\/\/\S+/g, "リンク").trim();
}
function speak(text) {
  if (!synth || !settings.readAloud) return; // 「返答を読み上げる」がオフなら読まない
  const t = cleanForSpeech(text);
  if (!t) return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ja-JP";
  u.rate = settings.rate;
  u.pitch = 0.9;
  const chosen = $("voiceSelect").value;
  const v = chosen && voices.find(v => v.name === chosen);
  if (v) u.voice = v;
  speakQueue++;
  setStatus("話しています…");
  activeUtterances.add(u);
  u.onend = u.onerror = () => {
    activeUtterances.delete(u);
    speakQueue = Math.max(0, speakQueue - 1);
    if (speakQueue === 0) speakingDone();
  };
  synth.speak(u);
  watchSpeaking();
}
// iPhone の Safari は、ユーザーがボタンを押した「その瞬間」に読み上げを始めないと、
// 以後の読み上げをすべて黙って無視する。空白や無音では合図にならないので、
// 最初に送信ボタンかマイクを押したとき、短く「はい」と実際に読み上げて合図にする。
let audioUnlocked = !isIOS; // PC はこの合図が不要
function unlockAudio() {
  if (audioUnlocked || !synth) return;
  audioUnlocked = true;
  const u = new SpeechSynthesisUtterance("はい");
  u.lang = "ja-JP";
  u.rate = settings.rate;
  const chosen = $("voiceSelect").value;
  const v = chosen && voices.find(v => v.name === chosen);
  if (v) u.voice = v;
  synth.speak(u);
}
function stopSpeaking() {
  if (synth && (synth.speaking || synth.pending)) synth.cancel();
  clearInterval(speakWatch); speakWatch = null;
  activeUtterances.clear();
  speakQueue = 0;
  lastSpeechEnd = Date.now();
  if (!busy) setStatus("待機中");
}

// ============================================================
//  音声認識（聞き取り）
// ============================================================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isStandalone = window.navigator.standalone === true ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
let recog = null, listening = false, gotSomething = false, startTimer = null;
let heard = "", silenceTimer = null;

// iPhone では同じ聞き取りを使い回すと2回目以降に動かないことがあるので、毎回作り直す
function createRecognizer() {
  const r = new SR();
  r.lang = "ja-JP";
  r.interimResults = true;
  r.continuous = false;
  r.onstart = () => { clearTimeout(startTimer); setStatus(handsFree() ? "聞いています…（話しかけてください）" : "聞いています…（もう一度押すと送信）"); };
  // iPhone の Safari は「確定(isFinal)」を返さずに終わることがあるので、
  // 聞き取れた文章を毎回まるごと保持し、話が途切れたら（または終了時に）送る。
  r.onresult = (e) => {
    gotSomething = true;
    let text = "", allFinal = true;
    for (let i = 0; i < e.results.length; i++) {
      text += e.results[i][0].transcript;
      if (!e.results[i].isFinal) allFinal = false;
    }
    heard = text;
    textInput.value = text;
    clearTimeout(silenceTimer);
    if (allFinal && text.trim()) finishListening();
    else silenceTimer = setTimeout(finishListening, 1500); // 1.5秒黙ったら送信
  };
  r.onerror = (e) => {
    gotSomething = true;
    const err = e.error;
    if (err === "not-allowed" || err === "service-not-allowed") {
      addMsg("error", isIOS
        ? "音声入力が使えません（" + err + "）。iPhoneの「設定」→「一般」→「キーボード」で「音声入力」をオンにし、「設定」→「アプリ」→「Safari」→「マイク」を「確認」か「許可」にしてください。"
        : "マイクの使用が許可されていません。ブラウザのアドレスバーからマイクを許可してください。");
    } else if (err === "audio-capture") {
      addMsg("error", "マイクが使えません（audio-capture）。ほかのアプリがマイクを使っていないか確認してください。");
    } else if (err === "no-speech") {
      // 常時会話モードでは、黙っていただけなので何も出さずに聞き取りを続ける
      if (!handsFree()) addMsg("system", "声が聞き取れませんでした。マイクを押してから、はっきり話しかけてください。");
    } else if (err !== "aborted") {
      addMsg("error", "音声認識エラー: " + err);
    }
    // マイクが使えない状態では、今だけ自動の聞き取りを止める（エラーがくり返し出ないように）。
    // 設定としては保存しないので、次に開いたとき（マイクを許可したあと）は、また常時会話で始まる。
    if (["not-allowed", "service-not-allowed", "audio-capture"].includes(err) && handsFree()) {
      setHandsFree(false, false);
      addMsg("system", "常時会話を一時停止しました。マイクを許可してから、右上の「🎙 常時会話」ボタンで再開してください。");
    }
    stopListening(false);
    if (err === "no-speech") scheduleRelisten();
  };
  r.onend = () => {
    clearTimeout(startTimer);
    if (!listening) return;
    if (!gotSomething && !heard.trim()) {
      if (handsFree()) { stopListening(false); scheduleRelisten(); return; }
      addMsg("system", "声が聞き取れませんでした。もう一度マイクを押して話しかけてください。");
    }
    finishListening();
  };
  return r;
}

if (!SR) {
  micBtn.title = "このブラウザは音声入力に対応していません";
}

// ------------------------------------------------------------
//  常時会話モード（PC）：クリックしなくても、話しかけ続けられる
//  ・ハヤトが話し終えたら、自動で聞き取りを始める
//  ・黙っていて聞き取りが途切れても、自動で再開する
//  ・ハヤトが話している／考えている間は聞かない（自分の声を拾わないため）
// ------------------------------------------------------------
function handsFree() { return settings.autoListen && !isIOS && !!SR; }
// PC では、常時会話モードを最初からオンにする（以前の版でオフが保存されていても、一度だけオンに直す）
if (store.get("handsFreeDefault", "") !== "done") {
  if (!isIOS) { settings.autoListen = true; store.set("autoListen", "true"); }
  store.set("handsFreeDefault", "done");
}
let relistenTimer = null;
function scheduleRelisten(delay = 400) {
  clearTimeout(relistenTimer);
  if (!handsFree()) return;
  relistenTimer = setTimeout(() => {
    if (handsFree() && !busy && !listening && speakQueue === 0 && !(synth && synth.speaking)
        && !document.hidden && !dlg.open && settings.apiKey) {
      startListening();
    }
  }, delay);
}
function setHandsFree(on, persist = true) {
  settings.autoListen = on;
  if (persist) store.set("autoListen", String(on));
  const cb = document.getElementById("autoListen2");
  if (cb) cb.checked = on;
  const btn = document.getElementById("handsFreeBtn");
  if (btn) {
    btn.textContent = on ? "🎙 常時会話 ON" : "🎙 常時会話 OFF";
    btn.classList.toggle("on", on);
  }
  if (on) scheduleRelisten(200);
  else if (listening) stopListening(true);
  setStatus(on && listening ? "聞いています…" : statusEl.textContent);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (listening) stopListening(true); }
  else scheduleRelisten(300);
});

// ------------------------------------------------------------
//  iPhone 用：キーボードの音声入力（iPhone 標準）を使う方式
//  iPhone の Safari は、一度読み上げをするとブラウザの音声認識が使えなくなる不具合があるため、
//  iPhone では入力欄を開いて、キーボードのマイクで話してもらう。話し終えて2秒で自動送信。
// ------------------------------------------------------------
let dictationMode = false, dictationTimer = null, dictationHintShown = false;
function startDictation() {
  if (busy) return;
  stopSpeaking();
  dictationMode = true;
  textInput.value = "";
  textInput.focus(); // ボタンを押した瞬間でないとキーボードが開かない
  micBtn.classList.add("listening");
  setStatus("キーボードのマイク🎤で話してください");
  if (!dictationHintShown) {
    dictationHintShown = true;
    addMsg("system", "iPhone では、キーボードの右下（または左下）にあるマイクのマークを押して話してください。話し終えて2秒たつと、自動で送信します。");
  }
}
function endDictation() {
  dictationMode = false;
  clearTimeout(dictationTimer);
  micBtn.classList.remove("listening");
}
textInput.addEventListener("input", () => {
  if (!dictationMode) return;
  clearTimeout(dictationTimer);
  if (!textInput.value.trim()) return;
  setStatus("聞き取り中…（話し終えて2秒で送信）");
  dictationTimer = setTimeout(() => {
    const text = textInput.value.trim();
    endDictation();
    if (text) { textInput.blur(); send(text); }
  }, 2000);
});
textInput.addEventListener("blur", () => {
  // キーボードを閉じたら、文字が入っていればすぐ送る
  if (!dictationMode) return;
  const text = textInput.value.trim();
  endDictation();
  if (text) send(text);
  else if (!busy && speakQueue === 0) setStatus("待機中");
});

function startListening() {
  if (listening || busy) return;
  if (isIOS) { startDictation(); return; }
  if (!SR) {
    addMsg("error", isStandalone
      ? "ホーム画面のアイコンから開くと、音声入力が使えません。Safari で直接開いてください。"
      : "このブラウザは音声入力に対応していません。iPhone は Safari、PC は Chrome で開いてください。");
    return;
  }
  // iPhone では、読み上げ中や止めた直後にマイクを始めると、マイクが音を拾えない。
  // 話している途中に押されたら、まず読み上げだけ止めて、もう一度押してもらう。
  if (synth && (synth.speaking || synth.pending)) {
    stopSpeaking();
    if (isIOS) {
      setStatus("読み上げを止めました。もう一度マイクを押してください");
      return;
    }
  }
  speakQueue = 0;
  heard = "";
  gotSomething = false;
  textInput.value = "";
  recog = createRecognizer();
  try {
    recog.start();
  } catch (e) {
    addMsg("error", "マイクを開始できませんでした（" + (e?.name || e) + "）。もう一度押してください。");
    return;
  }
  listening = true;
  micBtn.classList.add("listening");
  setStatus("マイクを準備中…");
  // 6秒たっても聞き取りが始まらなければ、原因を表示する
  clearTimeout(startTimer);
  startTimer = setTimeout(() => {
    if (listening && !gotSomething && statusEl.textContent.startsWith("マイクを準備中")) {
      addMsg("error", "マイクが反応しません。" + (isIOS
        ? (isStandalone
            ? "ホーム画面のアイコンからではなく、Safari で直接開いてみてください。"
            : "iPhoneの「設定」→「一般」→「キーボード」→「音声入力」がオンか確認してください。")
        : "ブラウザのアドレスバーの左にあるマークから、マイクが許可されているか確認してください。"));
      stopListening(true);
    }
  }, 6000);
}
// 聞き取りを終えて、聞こえた文章があれば送る
function finishListening() {
  const text = heard.trim();
  stopListening(false);
  heard = "";
  if (text) send(text);
}
function stopListening(abort = true) {
  if (!recog) return;
  clearTimeout(silenceTimer);
  clearTimeout(startTimer);
  listening = false;
  micBtn.classList.remove("listening");
  try { abort ? recog.abort() : recog.stop(); } catch {}
  if (!busy && speakQueue === 0) setStatus("待機中");
}

// ============================================================
//  Claude との会話
// ============================================================
// 【重要】Claude は返事の「考えた内容」に、その会話専用の署名を付ける。
// 会話の途中で前提（システムプロンプト）や過去のやり取りを変えると、署名が合わずエラーになる。
// そのため、前提は会話の最初に1回だけ作って固定し、過去のやり取りは書き換えず後ろに足すだけにする。
// 時刻のように毎回変わる情報は、前提ではなく毎回のメッセージの末尾に付ける。
let history = [];         // Claude に渡す会話履歴（後ろに足すだけ）
let systemPrompt = null;  // この会話の前提（会話の最初に作って固定）
let busy = false;

function resetConversation() {
  history = [];
  systemPrompt = null;
}
// 失敗したやり取り（その質問と、途中までの返事）を末尾から取り除く。
// 末尾を落とすだけなので、それより前の会話は変わらず、署名も壊れない。
function dropTurn(userTurn) {
  const i = history.lastIndexOf(userTurn);
  if (i >= 0) history.length = i;
}

function errorMessage(err) {
  const raw = String(err?.message || err || "");
  if (/credit balance|billing|insufficient.*(credit|fund)/i.test(raw) || err?.status === 402)
    return "Anthropic の残高がなくなりました。console.anthropic.com の「Billing（請求）」でチャージしてください。";
  if (err instanceof Anthropic.AuthenticationError)
    return "APIキーが正しくないか、有効期限が切れています。「⚙ 設定」でキーを入れ直してください。";
  if (err instanceof Anthropic.PermissionDeniedError)
    return "このAPIキーには利用する権限がありません。コンソールでキーの設定を確認してください。";
  if (err instanceof Anthropic.RateLimitError)
    return "リクエストが多すぎるか、月の上限額に達しました。少し待つか、コンソールの「Limits」を確認してください。";
  if (err instanceof Anthropic.APIConnectionError)
    return "Claude に接続できませんでした。電波やネット接続を確認して、もう一度話しかけてください。";
  if (err?.status === 529 || err?.status >= 500 || /overloaded/i.test(raw))
    return "Claude 側が混み合っています。少し待ってからもう一度話しかけてください。";
  return `Claude との通信でエラーが起きました。（詳細: ${err?.status ?? "-"} ${raw.replace(/\s+/g, " ").slice(0, 120)}）`;
}

// 1回分の応答を受け取る。混雑などで何も話す前に失敗したら、1回だけやり直す。
// mode: detectMode() の結果（モデル・じっくり・詳しく）
// onEvent: 「ネットで調べ始めた」などを画面に知らせる
async function askClaude(onText, mode, onEvent = () => {}) {
  const client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
  if (!systemPrompt) {
    systemPrompt = buildSystemPrompt(settings.userName) +
      "\n\n# 現在日時\n" + (settings.userName || "ボス") + "のメッセージの末尾にある（送信時刻: …）が、その時点の現在日時。" +
      "日時を答えるときや予定を考えるときに使う。送信時刻そのものを毎回読み上げたり、繰り返したりしない。";
  }
  const m = MODELS[mode.model] || MODELS.opus;
  const params = {
    model: m.id,
    // 詳しく・じっくりのときは長く書けるようにする
    max_tokens: (mode.deep || mode.detail) ? 16000 : 4096,
    system: systemPrompt,
    messages: history,
    // ふだんは速さ優先（low）、じっくり考えるときは high
    output_config: { effort: mode.deep ? "high" : "low" },
    // Web検索：最新の情報が必要なときだけ Claude が自分で使う
    tools: [{
      type: m.search, name: "web_search",
      max_uses: mode.deep ? 8 : 3,
      user_location: { type: "approximate", country: "JP", timezone: "Asia/Tokyo" },
    }],
    // 会話の前半を一時保存して、2回目以降の料金を下げる
    cache_control: { type: "ephemeral" },
  };
  if (m.fallback) {
    params.betas = ["server-side-fallback-2026-07-01"];
    params.fallbacks = "default"; // 安全判定で断られた場合は自動で別モデルに切り替え
  }
  const run = async () => {
    let sentText = false;
    const stream = client.beta.messages.stream(params);
    stream.on("text", (d) => { sentText = true; onText(d); });
    stream.on("streamEvent", (ev) => {
      if (ev.type === "content_block_start" && ev.content_block?.type === "server_tool_use") onEvent("search");
    });
    try { return await stream.finalMessage(); }
    catch (e) { e.sentText = sentText; throw e; }
  };
  try {
    return await run();
  } catch (e) {
    const retryable = !e.sentText &&
      (e instanceof Anthropic.APIConnectionError || /overloaded|api_error/i.test(String(e?.message)) || e?.status >= 500);
    if (!retryable) throw e;
    return await run();
  }
}

async function send(text) {
  text = (text || "").trim();
  if (dictationMode) endDictation();
  if (!text || busy) return;
  if (!settings.apiKey) {
    addMsg("system", "最初に「⚙ 設定」で Claude の APIキーを入力してください。");
    openSettings();
    return;
  }
  textInput.value = "";
  addMsg("user", text);
  showYou(text);
  toastEl.hidden = true;

  // 履歴が長くなりすぎたら、古いものを削るのではなく会話の記憶を新しくする
  // （途中を削ると署名が合わなくなるため）
  if (history.length >= MAX_HISTORY - 1) {
    resetConversation();
    addMsg("system", "会話が長くなったので、ハヤトの記憶を新しくしました。");
  }
  const now = new Date().toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", dateStyle: "full", timeStyle: "short" });
  const mode = detectMode(text);
  // 答え方の指示は、毎回のメッセージの末尾に付ける（前提＝システムプロンプトは会話中に変えられないため）
  let hints = `（送信時刻: ${now}）`;
  if (mode.detail) hints += "\n（回答形式: 詳しく。1行目に【要点】と書いて、音声で読み上げる2〜3文の要約を書く。次に改行して【詳細】と書き、画面で読む詳しい説明を書く。詳細では改行と「・」で整理してよい。）";
  if (mode.racing) hints += "\n（競馬予想: 必要に応じてWeb検索で出走表・過去成績・馬場状態・調教・騎手などを確認してから判断する。）";
  const userTurn = { role: "user", content: `${text}\n\n${hints}` };
  history.push(userTurn);

  busy = true;
  sendBtn.disabled = true;
  setStatus(mode.deep ? "じっくり考えています…" : "考えています…");
  const bodyEl = addMsg("hayato", "…");
  showBubble(mode.deep ? "……（じっくり考えています）" : "……", { thinking: true });
  const whoEl = bodyEl.parentElement.querySelector(".who");
  const tags = [MODELS[mode.model].label];
  if (mode.deep) tags.push("じっくり");
  if (mode.detail) tags.push("詳しく");
  const setWho = () => { whoEl.textContent = `ハヤト（${tags.join("・")}）`; };
  setWho();
  let shown = "", pending = "", cut = false;

  const onEvent = (kind) => {
    if (kind === "search") {
      if (!tags.includes("Web検索")) { tags.push("Web検索"); setWho(); }
      setStatus("ネットで調べています…");
      if (!shown) showBubble("……（ネットで調べています）", { thinking: true });
    }
  };
  const onText = (delta) => {
    if (!shown) bodyEl.textContent = "";
    shown += delta;
    bodyEl.textContent = shown;
    logEl.scrollTop = logEl.scrollHeight;
    // 吹き出しには、詳しく答えるときは要点だけ、ふだんは全文を出す
    if (mode.detail) {
      const i = shown.indexOf("【詳細】");
      showBubble((i >= 0 ? shown.slice(0, i) : shown).replace("【要点】", "").trim(), { more: i >= 0 });
    } else {
      showBubble(shown);
    }
    if (cut) return; // 詳しく答えるときは【詳細】以降は読み上げない
    pending += delta;
    if (mode.detail) {
      const i = pending.indexOf("【詳細】");
      if (i >= 0) { speak(pending.slice(0, i)); pending = ""; cut = true; return; }
    }
    // 文の区切りごとに読み上げ（話し始めを速くする）
    const m = pending.match(/^[\s\S]*[。！？!?\n]/);
    if (m) { speak(m[0]); pending = pending.slice(m[0].length); }
  };

  try {
    let final;
    try {
      final = await askClaude(onText, mode, onEvent);
    } catch (e) {
      // 万一、署名のエラーが出たら、会話の記憶を新しくして同じ質問をもう一度送る
      if (shown || !/signature/i.test(String(e?.message))) throw e;
      resetConversation();
      history.push(userTurn);
      addMsg("system", "ハヤトの記憶を新しくして、もう一度聞き直しています。");
      final = await askClaude(onText, mode, onEvent);
    }
    // Web検索が長引くと途中で一度区切られる（pause_turn）ので、続きを頼む
    for (let i = 0; i < 4 && final.stop_reason === "pause_turn"; i++) {
      history.push({ role: "assistant", content: final.content });
      final = await askClaude(onText, mode, onEvent);
    }
    if (!cut && pending.trim()) speak(pending);

    if (final.stop_reason === "refusal") {
      bodyEl.textContent = "申し訳ありません、その件にはお答えできません。";
      showBubble(bodyEl.textContent);
      speak(bodyEl.textContent);
      dropTurn(userTurn);   // 断られたやり取りは履歴に残さない
    } else {
      history.push({ role: "assistant", content: final.content });
      if (!shown) bodyEl.textContent = "（返答なし）";
    }
  } catch (err) {
    dropTurn(userTurn);
    if (!shown) {
      bodyEl.parentElement.remove();
      showBubble("……うまくお答えできませんでした。下のお知らせを確認してください。");
    }
    addMsg("error", errorMessage(err));
  } finally {
    busy = false;
    sendBtn.disabled = false;
    if (speakQueue === 0) {
      setStatus("待機中");
      scheduleRelisten(400); // 読み上げなしのときも、常時会話モードなら聞き取りを再開
    }
  }
}

// ============================================================
//  UI イベント
// ============================================================
// マイクのときは読み上げの合図を出さない（iPhone では音を出した直後だとマイクが動かないため）
micBtn.addEventListener("click", () => listening ? finishListening() : startListening());
sendBtn.addEventListener("click", () => { unlockAudio(); send(textInput.value); });
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); unlockAudio(); send(textInput.value); }
});
$("stopBtn").addEventListener("click", stopSpeaking);
$("stopBtn2").addEventListener("click", stopSpeaking);
$("historyBtn2").addEventListener("click", () => $("historyBtn").click());
$("clearBtn").addEventListener("click", () => {
  stopSpeaking(); resetConversation(); logEl.innerHTML = ""; clearThread(); greet();
});

// ---- 操作パネルのチェック（返答を読み上げる・常時会話モード） ----
$("readAloud").checked = settings.readAloud;
$("readAloud").addEventListener("change", (e) => {
  settings.readAloud = e.target.checked;
  store.set("readAloud", String(settings.readAloud));
  if (!settings.readAloud) stopSpeaking();
});
$("autoListen2").checked = settings.autoListen;
$("autoListen2").addEventListener("change", (e) => setHandsFree(e.target.checked));
$("handsFreeBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  setHandsFree(!settings.autoListen);
});

// ---- 操作パネルの開け閉め（PC の画面だけ。画面をクリックすると開く／閉じる） ----
const wideMQ = window.matchMedia("(min-width: 900px)");
const panelEl = $("panel");
function updatePanelHeight() {
  document.documentElement.style.setProperty("--panel-h", panelEl.offsetHeight + "px");
}
function setPanel(open) {
  document.body.classList.toggle("panel-open", open);
  updatePanelHeight();
  if (open) setTimeout(() => textInput.focus(), 50);
}
$("thread").parentElement.addEventListener("click", (e) => {
  if (!wideMQ.matches) return;
  // 会話の文字を選んだり、お知らせを読んだりするときは開け閉めしない
  if (e.target.closest(".thread, .toast")) return;
  setPanel(!document.body.classList.contains("panel-open"));
});
// 文字を打ち始めたら、自動でパネルを開いて入力欄に入れる
window.addEventListener("keydown", (e) => {
  if (!wideMQ.matches || document.body.classList.contains("panel-open")) return;
  if (dlg.open || !$("history").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length === 1 || e.key === "Process") setPanel(true);
});
window.addEventListener("resize", updatePanelHeight);
// PC で初めて開いたときは、パネルの開き方を一度だけ案内する
if (wideMQ.matches && store.get("panelHint", "") !== "done") {
  setTimeout(() => showToast("画面をクリックすると、下に操作パネル（入力欄・マイク・読み上げ設定など）が開きます。", "info"), 1200);
  store.set("panelHint", "done");
}

function openSettings() {
  $("apiKey").value = settings.apiKey;
  $("userName").value = settings.userName;
  $("modelSelect").value = settings.model;
  $("rate").value = settings.rate; $("rateVal").textContent = settings.rate;
  $("autoListen").checked = settings.autoListen;
  if (settings.voice) $("voiceSelect").value = settings.voice;
  dlg.showModal();
}
$("settingsBtn").addEventListener("click", openSettings);
$("cancelSettings").addEventListener("click", () => dlg.close());
$("rate").addEventListener("input", (e) => $("rateVal").textContent = e.target.value);
$("testVoice").addEventListener("click", () => {
  if (!synth) { alert("このブラウザは読み上げに対応していません。"); return; }
  synth.cancel();
  audioUnlocked = true; // ボタンを押した瞬間の読み上げなので、iPhone の合図にもなる
  const u = new SpeechSynthesisUtterance("お待ちしていました。ハヤトです。本日の予定と、明日の天気を確認しましょう。");
  u.lang = "ja-JP";
  u.rate = parseFloat($("rate").value);
  u.pitch = 0.9;
  const chosen = $("voiceSelect").value;
  const v = chosen && voices.find(v => v.name === chosen);
  if (v) u.voice = v;
  synth.speak(u);
});
$("saveSettings").addEventListener("click", () => {
  settings.apiKey = $("apiKey").value.trim();
  const newName = $("userName").value.trim();
  // 呼ばれ方を変えたら前提が変わるので、次の会話から新しい前提で始める
  if (newName !== settings.userName) resetConversation();
  settings.userName = newName;
  settings.model = $("modelSelect").value;
  store.set("model", settings.model);
  settings.voice = $("voiceSelect").value;
  settings.rate = parseFloat($("rate").value);
  settings.autoListen = $("autoListen").checked;
  store.set("apiKey", settings.apiKey);
  store.set("userName", settings.userName);
  store.set("voice", settings.voice);
  store.set("rate", String(settings.rate));
  store.set("autoListen", String(settings.autoListen));
  dlg.close();
  setHandsFree(settings.autoListen);
  addMsg("system", "設定を保存しました。");
});

// iPhone では「タップして開始」を押した瞬間に挨拶を読み上げ、それを読み上げ許可の合図にする
if (isIOS && synth) {
  const ov = $("startOverlay");
  ov.hidden = false;
  ov.addEventListener("click", () => {
    const name = settings.userName || "ボス";
    const u = new SpeechSynthesisUtterance(`お待ちしていました、${name}。`);
    u.lang = "ja-JP";
    u.rate = settings.rate;
    const chosen = $("voiceSelect").value;
    const v = chosen && voices.find(v => v.name === chosen);
    if (v) u.voice = v;
    synth.speak(u);
    audioUnlocked = true;
    ov.hidden = true;
  }, { once: true });
}

function greet() {
  const name = settings.userName || "ボス";
  const hello = `お待ちしていました、${name}。ハヤトです。マイクを押すか、文字で話しかけてください。`;
  addMsg("hayato", hello);
  showBubble(hello);
  if (!settings.apiKey) addMsg("system", "はじめに「⚙ 設定」で Claude の APIキーを入力してください。");
}
try { localStorage.removeItem("hayato.passcode"); } catch {}
greet();

// 常時会話モード：ボタンの表示をそろえ、開いたらすぐ聞き取りを始める（PC）
setHandsFree(settings.autoListen);
scheduleRelisten(1500);
// ブラウザが自動開始を止めた場合に備えて、最初にクリックしたときにも始める
window.addEventListener("pointerdown", () => scheduleRelisten(150), { once: true });

// 設定（APIキーなど）を保存できる環境か調べ、できなければ原因を案内する
(function checkEnvironment() {
  const ua = navigator.userAgent;
  let inApp = "";
  if (/\bLine\//i.test(ua)) inApp = "LINE";
  else if (/GSA\//.test(ua)) inApp = "Google アプリ";
  else if (/FBAN|FBAV|Instagram/i.test(ua)) inApp = "SNS アプリ";
  else if (/CriOS/.test(ua)) inApp = "Chrome（iPhone 版）";
  if (inApp) {
    addMsg("error", `今は「${inApp}」の中でハヤトを開いています。この状態だと、APIキーが保存されなかったり、マイクが使えなかったりします。` +
      "右下などにある「Safari で開く」を選ぶか、Safari のアドレスバーに直接URLを入力して開いてください。");
    return;
  }
  let canSave = false;
  try {
    localStorage.setItem("hayato.__test", "1");
    canSave = localStorage.getItem("hayato.__test") === "1";
    localStorage.removeItem("hayato.__test");
  } catch {}
  if (!canSave) {
    addMsg("error", "このブラウザでは設定を保存できません。プライベートブラウズを使っている場合は、通常のタブで開いてください。" +
      "iPhone の場合は「設定」→「アプリ」→「Safari」で「すべてのCookieをブロック」をオフにしてください。");
  }
})();
</script>
