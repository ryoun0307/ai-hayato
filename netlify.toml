[build]
  # ビルド処理は不要。index.html をそのまま公開する
  publish = "."
  command = ""
  # 本番（main）以外のブランチ（dev など）やプレビューは公開しない。
  # Netlify のクレジットを、本番公開のときだけ使うため。
  # このコマンドが成功（終了コード0）すると、Netlify は公開処理をスキップする。
  ignore = "test \"$CONTEXT\" != \"production\""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 内部ファイルを公開しない
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self)"
